# Common errors
error.common.internal=发生服务器内部错误。
error.common.ip=无法找到合适的服务器IP地址。

# User domain errors
error.user.validation.invalid-email=电子邮件格式无效。
error.user.validation.email-duplicated=该电子邮件已被使用。
error.user.auth.invalid-token=身份验证令牌无效。
error.user.auth.forbidden=没有权限执行此操作。
error.auth.role.not-found=请求的角色不存在。
error.user.not-found=未找到用户。
error.auth.session.not-found=未找到认证会话。

# Product domain errors
error.product.validation.negative-price=价格不能为负数。
error.product.not-found=未找到商品。
error.product.internal.save-failed=商品保存失败。

# Generic fallback
error.generic.bad-request=请求无效。
error.generic.bind=绑定请求时发生错误。
error.generic.constraint=违反约束条件。
error.generic.type-mismatch=参数类型无效。
error.generic.invalid-json=解析请求正文（JSON）失败。
error.generic.missing-parameter=缺少必需的参数。
error.generic.missing-path-variable=缺少必需的路径变量。
error.generic.method-not-allowed=不支持该HTTP方法。
error.generic.unsupported-media-type=不支持该Content-Type。
error.generic.unexpected=发生了意外错误。
