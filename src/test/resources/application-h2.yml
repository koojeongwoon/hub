spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop   # 테스트마다 엔티티 기반으로 테이블 생성/삭제
    properties:
      hibernate.format_sql: true
      hibernate.show_sql: true